name: garbage-collector

services:
  convex:
    build:
      context: .
      dockerfile: packages/convex/Dockerfile
    environment:
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?Set PUBLIC_WEB_URL in .env}
      PUBLIC_CONVEX_URL: ${PUBLIC_CONVEX_URL:?Set PUBLIC_CONVEX_URL in .env}
      INTERNAL_CONVEX_URL: ${INTERNAL_CONVEX_URL:?Set INTERNAL_CONVEX_URL in .env}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_ALLOWED_ORIGIN: ${BETTER_AUTH_ALLOWED_ORIGIN:?Set BETTER_AUTH_ALLOWED_ORIGIN in .env}
      SECRET_MASTER_KEY: ${SECRET_MASTER_KEY:?Set SECRET_MASTER_KEY in .env}
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN in .env}
      GITHUB_APP_ID: ${GITHUB_APP_ID:?Set GITHUB_APP_ID in .env}
      GITHUB_APP_CLIENT_ID: ${GITHUB_APP_CLIENT_ID:?Set GITHUB_APP_CLIENT_ID in .env}
      GITHUB_APP_CLIENT_SECRET: ${GITHUB_APP_CLIENT_SECRET:?Set GITHUB_APP_CLIENT_SECRET in .env}
      GITHUB_APP_PRIVATE_KEY: ${GITHUB_APP_PRIVATE_KEY:?Set GITHUB_APP_PRIVATE_KEY in .env}
      GITHUB_APP_SLUG: ${GITHUB_APP_SLUG:?Set GITHUB_APP_SLUG in .env}
      GITHUB_APP_WEBHOOK_SECRET: ${GITHUB_APP_WEBHOOK_SECRET:?Set GITHUB_APP_WEBHOOK_SECRET in .env}
      CONVEX_DATA_PATH: ${CONVEX_DATA_PATH:?Set CONVEX_DATA_PATH in .env}
      CODEX_HOME_ROOT: ${CODEX_HOME_ROOT:?Set CODEX_HOME_ROOT in .env}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:?Set WORKSPACE_ROOT in .env}
      SMOKE_SUBSCRIPTION_TIMEOUT_SECONDS: ${SMOKE_SUBSCRIPTION_TIMEOUT_SECONDS:?Set SMOKE_SUBSCRIPTION_TIMEOUT_SECONDS in .env}
      CONVEX_CLOUD_ORIGIN: ${PUBLIC_CONVEX_URL:?Set PUBLIC_CONVEX_URL in .env}
      CONVEX_SITE_ORIGIN: ${PUBLIC_WEB_URL:?Set PUBLIC_WEB_URL in .env}
      CONVEX_SITE_URL: ${PUBLIC_WEB_URL:?Set PUBLIC_WEB_URL in .env}
      DATA_DIR: ${CONVEX_DATA_PATH:?Set CONVEX_DATA_PATH in .env}
      DISABLE_BEACON: "true"
      DISABLE_METRICS_ENDPOINT: "true"
      REDACT_LOGS_TO_CLIENT: "true"
      RUST_LOG: ${CONVEX_RUST_LOG:-warn}
    ports:
      # The site port is first so `just status` can use its localhost:3210 fallback.
      - "${CONVEX_SITE_PORT:-3210}:3211"
      - "${CONVEX_API_PORT:-3211}:3210"
    volumes:
      - convex-data:${CONVEX_DATA_PATH:?Set CONVEX_DATA_PATH in .env}
    restart: unless-stopped
    stop_grace_period: 30s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:3211/health/ready"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 20s

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        PUBLIC_CONVEX_URL: ${PUBLIC_CONVEX_URL:?Set PUBLIC_CONVEX_URL in .env}
        PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:?Set PUBLIC_WEB_URL in .env}
    depends_on:
      convex:
        condition: service_healthy
    ports:
      - "${WEB_PORT:-4173}:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /var/cache/nginx
      - /var/run
      - /tmp
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1:8080/health/ready"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s

  worker:
    build:
      context: .
      dockerfile: apps/worker/Dockerfile
    depends_on:
      convex:
        condition: service_healthy
    environment:
      WORKER_TOKEN: ${WORKER_TOKEN:?Set WORKER_TOKEN in .env}
      CODEX_HOME_ROOT: ${CODEX_HOME_ROOT:?Set CODEX_HOME_ROOT in .env}
      WORKSPACE_ROOT: ${WORKSPACE_ROOT:?Set WORKSPACE_ROOT in .env}
      WORKER_PROTOCOL_URL: http://convex:3211/worker/protocol
    ports:
      - "${WORKER_HEALTH_PORT:-8081}:8081"
    volumes:
      - codex-home:${CODEX_HOME_ROOT:?Set CODEX_HOME_ROOT in .env}
    tmpfs:
      - ${WORKSPACE_ROOT:?Set WORKSPACE_ROOT in .env}:uid=10001,gid=10001,mode=0700
      - /tmp:uid=10001,gid=10001,mode=1777
    restart: unless-stopped
    init: true
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://localhost:8081/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  convex-data:
  codex-home:
