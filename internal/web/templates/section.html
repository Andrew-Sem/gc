{{define "section"}}<section id="repositories" data-spec="repositories">
{{if .Error}}<p data-spec="error" data-error="{{.Error}}" role="alert">{{.Message}}</p>
{{end}}<form data-spec="connect-form" method="post" action="/repositories" hx-post="/repositories" hx-target="#repositories" hx-swap="outerHTML">
<input name="repo" placeholder="owner/name" value="{{.Input}}" required>
<button type="submit">Подключить</button>
</form>
{{if .Repositories}}<ul>
{{range .Repositories}}<li data-spec="repository-row" data-repo="{{.}}">{{.}}
<form method="post" action="/repositories/disconnect" hx-post="/repositories/disconnect" hx-target="#repositories" hx-swap="outerHTML">
<input type="hidden" name="repo" value="{{.}}">
<button type="submit">Отключить</button>
</form>
</li>
{{end}}</ul>
{{else}}<p data-spec="empty">Пока ничего не подключено.</p>
{{end}}</section>
{{end}}
